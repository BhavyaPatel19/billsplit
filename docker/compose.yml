# Local development stack.
#   pnpm docker:up    -> infrastructure only (postgres, valkey, S3, mailpit); run apps with `pnpm dev`
#   pnpm docker:app   -> also build and run the production api + web images (with migrations)
name: billsplit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billsplit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billsplit}
      POSTGRES_DB: ${POSTGRES_DB:-billsplit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development (stands in for the AWS S3 bucket).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-billsplit}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-billsplit-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the receipts bucket once the S3 service is healthy.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-billsplit}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-billsplit-secret}
      AWS_DEFAULT_REGION: us-east-1
      RECEIPTS_BUCKET: ${RECEIPTS_BUCKET:-billsplit-receipts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$RECEIPTS_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://s3:9000 s3 mb "s3://$$RECEIPTS_BUCKET";
        echo "bucket $$RECEIPTS_BUCKET ready"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # ---- production images, only with `--profile app` ----------------------------------------

  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: billsplit-api:${APP_VERSION:-local}
    command: ["node", "node_modules/@billsplit/db/dist/cli.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-billsplit}:${POSTGRES_PASSWORD:-billsplit}@postgres:5432/${POSTGRES_DB:-billsplit}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: billsplit-api:${APP_VERSION:-local}
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-billsplit}:${POSTGRES_PASSWORD:-billsplit}@postgres:5432/${POSTGRES_DB:-billsplit}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-secret-local-dev-secret-local-dev}
      EMAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: BillSplit <no-reply@localhost>
      REDIS_URL: redis://valkey:6379
      RECEIPTS_BUCKET: ${RECEIPTS_BUCKET:-billsplit-receipts}
      # The API reaches S3 inside the network; browsers get URLs signed for localhost.
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-billsplit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-billsplit-secret}
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: billsplit-worker:${APP_VERSION:-local}
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-billsplit}:${POSTGRES_PASSWORD:-billsplit}@postgres:5432/${POSTGRES_DB:-billsplit}
      REDIS_URL: redis://valkey:6379
      RECEIPTS_BUCKET: ${RECEIPTS_BUCKET:-billsplit-receipts}
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-billsplit}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-billsplit-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  s3-data:
